edition = "2023";

package cards;

import "google/protobuf/wrappers.proto";

option go_package = "github.com/artni96/GophKeeper/api/proto/cards";

service CardService {
  rpc CreateCard (CardCreateRequest) returns (CardCreateResponse);
  rpc GetCard(CardGetRequest) returns (CardGetResponse);
  rpc UpdateCard (CardUpdateRequest) returns (CardUpdateResponse);
  rpc DeleteCard (CardDeleteRequest) returns (CardDeleteResponse);
  rpc GetListCard (CardGetListRequest) returns (CardGetListResponse);
}


message CardCreateRequest {
  google.protobuf.BytesValue pan = 1;
  google.protobuf.BytesValue holder = 2;
  google.protobuf.BytesValue expiry_date = 3;
  google.protobuf.BytesValue cvv = 4;
  google.protobuf.BytesValue pin = 5;
  google.protobuf.StringValue bank = 6;
  google.protobuf.StringValue brand = 7;
  google.protobuf.StringValue title = 8;
  google.protobuf.StringValue description = 9;

  google.protobuf.BytesValue pan_nonce = 10;
  google.protobuf.UInt64Value pan_key_id = 11;

  google.protobuf.BytesValue holder_nonce = 12;
  google.protobuf.UInt64Value holder_key_id = 13;

  google.protobuf.BytesValue expiry_date_nonce = 14;
  google.protobuf.UInt64Value expiry_date_key_id = 15;

  google.protobuf.BytesValue cvv_nonce = 16;
  google.protobuf.UInt64Value cvv_key_id = 17;

  google.protobuf.BytesValue pin_nonce = 18;
  google.protobuf.UInt64Value pin_key_id = 19;
}

message CardCreateResponse {
  uint64 number = 1;
}

message CardGetRequest {
  uint64 number = 1;
}

message CardGetResponse {
  bytes pan = 1;
  bytes holder = 2;
  bytes expiry_date = 3;
  bytes cvv = 4;
  bytes pin = 5;
  string bank = 6;
  string brand = 7;
  string title = 8;
  string description = 9;
  uint64 number = 10;
  string created_at = 11;
  string updated_at = 12;

  bytes pan_nonce = 13;
  uint64 pan_key_id = 14;

  bytes holder_nonce = 15;
  uint64 holder_key_id = 16;

  bytes expiry_date_nonce = 17;
  uint64 expiry_date_key_id = 18;

  bytes cvv_nonce = 19;
  uint64 cvv_key_id = 20;

  bytes pin_nonce = 21;
  uint64 pin_key_id = 22;
}

message CardUpdateRequest {
  google.protobuf.BytesValue pan = 1;
  google.protobuf.BytesValue holder = 2;
  google.protobuf.BytesValue expiry_date = 3;
  google.protobuf.BytesValue cvv = 4;
  google.protobuf.BytesValue pin = 5;
  google.protobuf.StringValue bank = 6;
  google.protobuf.StringValue brand = 7;
  google.protobuf.StringValue title = 8;
  google.protobuf.StringValue description = 9;

  google.protobuf.BytesValue pan_nonce = 10;
  google.protobuf.UInt64Value pan_key_id = 11;

  google.protobuf.BytesValue holder_nonce = 12;
  google.protobuf.UInt64Value holder_key_id = 13;

  google.protobuf.BytesValue expiry_date_nonce = 14;
  google.protobuf.UInt64Value expiry_date_key_id = 15;

  google.protobuf.BytesValue cvv_nonce = 16;
  google.protobuf.UInt64Value cvv_key_id = 17;

  google.protobuf.BytesValue pin_nonce = 18;
  google.protobuf.UInt64Value pin_key_id = 19;

  uint64 number = 20;
}

message CardUpdateResponse {
}

message CardDeleteRequest {
  uint64 number = 1;
}

message CardDeleteResponse {
}

message CardGetListRequest {
}

message CardGetListResponse {
  repeated CardGetResponse cards = 1;
}

